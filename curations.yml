# $ORT_CONFIG_DIR/curations.yml
#
# Corrects INVALID or MISSING package license metadata — not a policy tool. If ORT's
# detected/declared license for a package is simply wrong (bad SPDX mapping, missing
# license field, metadata-only package misidentified as having a license), fix it here.
#
# If the license data is CORRECT and the question is whether OEI accepts it, that's
# license-classifications.yml + evaluator.rules.kts, not this file. (BlueOak-1.0.0 and
# CC-BY-4.0 from core's FOSSA findings are both correctly-detected licenses — neither
# belongs here.)
#
# Format reference: https://github.com/oss-review-toolkit/ort/blob/main/docs/config-file-curations-yml.md
#
# Example — a real pattern you may hit eventually (not hypothetical, this is a known
# case in the Python ecosystem): a package whose declared license string doesn't parse
# as valid SPDX, corrected after checking the actual LICENSE file in source:
#
# - id: "PyPI::example-package:1.0.0"
#   curations:
#     comment: >-
#       Declared license "BSD License" doesn't parse as SPDX. Confirmed BSD-3-Clause
#       per https://github.com/example/example-package/blob/v1.0.0/LICENSE.
#     concluded_license: "BSD-3-Clause"
#     declared_license_mapping:
#       BSD License: "BSD-3-Clause"

[]
