# $ORT_CONFIG_DIR/resolutions.yml
#
# Documents a deliberate, reviewed exception to a specific flagged issue or rule
# violation — your audit trail of "we looked at this, here's why it's acceptable."
# Distinct from curations.yml (fixes bad data) and license-classifications.yml
# (changes policy for a whole license category going forward). A resolution here
# accepts one specific violation on one specific package/version; it does not change
# how that license is treated anywhere else.
#
# Matching is by regex against the violation/issue message, so pin to a specific
# package+version rather than a loose pattern unless the exception is genuinely meant
# to survive every future version bump unreviewed.
#
# Format reference: https://github.com/oss-review-toolkit/ort/blob/main/docs/config-file-resolutions-yml.md
#
# Example shape for when this gets its first real entry:
#
# rule_violations:
#   - message: "STRONG_COPYLEFT_LICENSE.*SomePackage:2\\.3\\.1.*"
#     reason: "LICENSE_ACQUIRED_EXCEPTION"
#     comment: >-
#       Commercial license acquired for this dependency — see [link to the actual
#       agreement/record]. Does not apply to other SomePackage versions.

issues: []
rule_violations: []
vulnerabilities: []
